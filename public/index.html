<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Card</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; background: #f5f5f5; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #1a1a1a; color: #eee; } table { color: #eee; } th { border-color: #333 !important; } td { border-color: #2a2a2a !important; } }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  h1 { font-size: 1.3rem; margin: 0; }
  #status { background: canvas; border-radius: 10px; padding: 1.5rem; text-align: center; margin-bottom: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  #clockLabel { font-size: 1.1rem; margin-bottom: 1rem; }
  button { padding: 0.7rem 1.5rem; font-size: 1rem; border-radius: 8px; border: none; cursor: pointer; }
  #toggleBtn.in { background: #dc2626; color: white; }
  #toggleBtn.out { background: #16a34a; color: white; }
  a.export, button.logout { font-size: 0.85rem; color: inherit; text-decoration: none; opacity: 0.7; background: none; border: none; cursor: pointer; padding: 0; }
  table { width: 100%; border-collapse: collapse; background: canvas; border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #eee; font-size: 0.9rem; vertical-align: top; }
  th { font-weight: 600; }
  td.desc { white-space: pre-wrap; max-width: 22rem; }
  .actions { display: flex; gap: 1rem; margin-top: 1rem; }
  .fields { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1rem; text-align: left; }
  .fields[hidden] { display: none; }
  .fields label { font-size: 0.8rem; opacity: 0.75; display: block; margin-bottom: 0.2rem; }
  .fields input { width: 100%; padding: 0.5rem; font-size: 0.95rem; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
  .fields textarea { width: 100%; padding: 0.5rem; font-size: 0.95rem; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-family: inherit; resize: vertical; min-height: 4.5rem; }
  @media (prefers-color-scheme: dark) { .fields input, .fields textarea { background: #2a2a2a; color: #eee; border-color: #444; } }
</style>
</head>
<body>
<header>
  <h1>Time Card</h1>
  <div class="actions">
    <a class="export" href="/raw.html">Enter raw data</a>
    <a class="export" href="/expense.html">Add expense</a>
    <a class="export" href="/billing.html">Billing</a>
    <a class="export" href="/api/export.csv">Export CSV</a>
    <form method="POST" action="/logout"><button class="logout" type="submit">Log out</button></form>
  </div>
</header>

<div id="status">
  <div id="clockLabel">Loading…</div>
  <div class="fields" id="clockInFields" hidden>
    <div>
      <label for="mileageStart">Mileage start</label>
      <input type="number" step="0.1" id="mileageStart" placeholder="e.g. 42318">
    </div>
  </div>
  <div class="fields">
    <div>
      <label for="description">Comment</label>
      <textarea id="description" placeholder="What are you doing?"></textarea>
    </div>
  </div>
  <div class="fields" id="clockOutFields" hidden>
    <div>
      <label for="mileageEnd">Mileage end</label>
      <input type="text" inputmode="numeric" id="mileageEnd" placeholder="e.g. 42361">
    </div>
  </div>
  <button id="toggleBtn" disabled>…</button>
</div>

<table>
  <thead><tr><th>Clock in</th><th>Clock out</th><th>Duration</th><th>Mileage</th><th>Description</th><th>Status</th><th></th></tr></thead>
  <tbody id="entries"></tbody>
</table>

<h2 style="font-size: 1.05rem; margin: 1.5rem 0 0.75rem;">Expenses</h2>
<table>
  <thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Note</th><th>Status</th><th></th></tr></thead>
  <tbody id="expenses"></tbody>
  <tfoot><tr><td colspan="2" style="font-weight:600;">Total</td><td id="expensesTotal" style="font-weight:600;"></td><td></td><td></td><td></td></tr></tfoot>
</table>
<div style="margin-top: 0.5rem;">
  <a class="export" href="/api/expenses/export.csv">Export expenses CSV</a>
</div>

<div id="version" style="text-align:center; font-size:0.75rem; opacity:0.4; margin-top:1.5rem;"></div>

<script>
async function api(path, opts) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (res.status === 401) { location.href = '/login'; throw new Error('unauthenticated'); }
  return res.json();
}

function fmt(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString();
}

function duration(start, end) {
  if (!end) return '—';
  const ms = new Date(end) - new Date(start);
  const h = Math.floor(ms / 3600000);
  const m = Math.round((ms % 3600000) / 60000);
  return h + 'h ' + m + 'm';
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function mileageEndPrefill(start) {
  if (start == null) return '';
  const str = String(Math.trunc(start));
  return str.length > 2 ? str.slice(0, -2) + 'xx' : 'xx';
}

function mileageRange(start, end) {
  if (start == null && end == null) return '—';
  if (start != null && end != null) return `${start} → ${end} (${(end - start).toFixed(1)})`;
  return start != null ? `${start} →` : `→ ${end}`;
}

async function refresh() {
  const { open } = await api('/api/status');
  const btn = document.getElementById('toggleBtn');
  const label = document.getElementById('clockLabel');
  const inFields = document.getElementById('clockInFields');
  const outFields = document.getElementById('clockOutFields');
  btn.disabled = false;
  if (open) {
    label.textContent = 'Clocked in since ' + fmt(open.clock_in);
    btn.textContent = 'Clock out';
    btn.className = 'in';
    inFields.hidden = true;
    outFields.hidden = false;
    document.getElementById('description').value = open.note || '';
    document.getElementById('mileageEnd').value = mileageEndPrefill(open.mileage_start);
  } else {
    label.textContent = 'Hello, Judy! You are not clocked in.';
    btn.textContent = 'Clock in';
    btn.className = 'out';
    inFields.hidden = false;
    outFields.hidden = true;
    document.getElementById('description').value = '';
  }

  const entries = await api('/api/entries');
  const tbody = document.getElementById('entries');
  tbody.innerHTML = entries.map(e => {
    const billed = e.billing_id != null;
    const status = billed ? 'Billed' : (e.clock_out ? 'Outstanding' : '—');
    const actions = billed
      ? ''
      : (e.clock_out ? `<a href="/raw.html?id=${e.id}">Edit</a> · ` : '') +
        `<button type="button" onclick="deleteEntry(${e.id})" style="padding:0.2rem 0.5rem; font-size:0.8rem;">Delete</button>`;
    return `<tr><td>${fmt(e.clock_in)}</td><td>${fmt(e.clock_out)}</td><td>${duration(e.clock_in, e.clock_out)}</td>` +
      `<td>${mileageRange(e.mileage_start, e.mileage_end)}</td><td class="desc">${escapeHtml(e.note)}</td>` +
      `<td>${status}</td><td>${actions}</td></tr>`;
  }).join('');

  await refreshExpenses();
}

async function deleteEntry(id) {
  if (!confirm('Delete this entry? This cannot be undone.')) return;
  await api(`/api/entries/${id}`, { method: 'DELETE' });
  refresh();
}

const CATEGORY_LABELS = { toll: 'Toll', parking: 'Parking', bus: 'Bus fare', other: 'Other' };

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString();
}

function fmtAmount(n) {
  return '$' + n.toFixed(2);
}

async function deleteExpense(id) {
  if (!confirm('Delete this expense? This cannot be undone.')) return;
  await api(`/api/expenses/${id}`, { method: 'DELETE' });
  refresh();
}

async function refreshExpenses() {
  const expenses = await api('/api/expenses');
  const tbody = document.getElementById('expenses');
  tbody.innerHTML = expenses.map(x => {
    const billed = x.billing_id != null;
    const actions = billed
      ? ''
      : `<a href="/expense.html?id=${x.id}">Edit</a> · <button type="button" onclick="deleteExpense(${x.id})" style="padding:0.2rem 0.5rem; font-size:0.8rem;">Delete</button>`;
    return `<tr><td>${fmtDate(x.date)}</td><td>${CATEGORY_LABELS[x.category] || x.category}</td>` +
      `<td>${fmtAmount(x.amount)}</td><td class="desc">${escapeHtml(x.note)}</td>` +
      `<td>${billed ? 'Billed' : 'Outstanding'}</td><td>${actions}</td></tr>`;
  }).join('');
  const total = expenses.reduce((sum, x) => sum + x.amount, 0);
  document.getElementById('expensesTotal').textContent = fmtAmount(total);
}

document.getElementById('mileageEnd').addEventListener('focus', (e) => {
  const v = e.target.value;
  const xIndex = v.toLowerCase().indexOf('xx');
  if (xIndex !== -1) e.target.setSelectionRange(xIndex, xIndex + 2);
});

document.getElementById('toggleBtn').addEventListener('click', async () => {
  const { open } = await api('/api/status');
  const note = document.getElementById('description').value;
  if (open) {
    const mileage_end = document.getElementById('mileageEnd').value;
    if (/x/i.test(mileage_end)) {
      alert('Replace the xx in mileage end with the actual last two digits.');
      return;
    }
    if (mileage_end !== '' && Number(mileage_end) < 0) {
      alert('Mileage end cannot be negative.');
      return;
    }
    await api('/api/clock-out', { method: 'POST', body: JSON.stringify({ mileage_end, note }) });
    document.getElementById('mileageEnd').value = '';
  } else {
    const mileage_start = document.getElementById('mileageStart').value;
    if (mileage_start !== '' && Number(mileage_start) < 0) {
      alert('Mileage start cannot be negative.');
      return;
    }
    await api('/api/clock-in', { method: 'POST', body: JSON.stringify({ mileage_start, note }) });
    document.getElementById('mileageStart').value = '';
  }
  refresh();
});

api('/api/version').then(({ sha }) => {
  document.getElementById('version').textContent = 'build ' + sha;
});

refresh();
</script>
</body>
</html>
