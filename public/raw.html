<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Card — Enter Raw Data</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; background: #f5f5f5; }
  @media (prefers-color-scheme: dark) { body { background: #1a1a1a; color: #eee; } input, textarea { background: #2a2a2a; color: #eee; border-color: #444; } }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  h1 { font-size: 1.3rem; margin: 0; }
  a.back { font-size: 0.85rem; color: inherit; opacity: 0.7; }
  form { background: canvas; border-radius: 10px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 1rem; }
  label { font-size: 0.85rem; opacity: 0.75; display: block; margin-bottom: 0.3rem; }
  input, textarea { width: 100%; padding: 0.55rem; font-size: 0.95rem; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-family: inherit; }
  textarea { min-height: 4.5rem; resize: vertical; }
  .row { display: flex; gap: 0.75rem; }
  .row > div { flex: 1; }
  button { padding: 0.7rem 1.5rem; font-size: 1rem; border-radius: 8px; border: none; cursor: pointer; background: #2563eb; color: white; }
  .error { color: #dc2626; font-size: 0.85rem; }
</style>
</head>
<body>
<header>
  <h1>Enter Raw Data</h1>
  <a class="back" href="/">&larr; Back</a>
</header>

<form id="rawForm">
  <div>
    <label for="startTime">Start time</label>
    <input type="datetime-local" id="startTime" required>
  </div>
  <div>
    <label for="endTime">End time</label>
    <input type="datetime-local" id="endTime" required>
  </div>
  <div>
    <label for="mileageStart">Start mileage</label>
    <input type="number" step="0.1" id="mileageStart" placeholder="e.g. 42318">
  </div>
  <div>
    <label for="mileageEnd">End mileage</label>
    <input type="number" step="0.1" id="mileageEnd" placeholder="e.g. 42361">
  </div>
  <div>
    <label for="description">Comment</label>
    <textarea id="description" placeholder="What did you do?"></textarea>
  </div>
  <div id="error" class="error" hidden></div>
  <button type="submit">Save</button>
</form>

<script>
document.getElementById('rawForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('error');
  errorEl.hidden = true;

  const startTimeLocal = document.getElementById('startTime').value;
  const endTimeLocal = document.getElementById('endTime').value;
  if (!startTimeLocal || !endTimeLocal) {
    errorEl.textContent = 'Start time and end time are both required.';
    errorEl.hidden = false;
    return;
  }

  const body = {
    start_time: new Date(startTimeLocal).toISOString(),
    end_time: new Date(endTimeLocal).toISOString(),
    mileage_start: document.getElementById('mileageStart').value,
    mileage_end: document.getElementById('mileageEnd').value,
    note: document.getElementById('description').value,
  };

  const res = await fetch('/api/entries/raw', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });

  if (res.status === 401) { location.href = '/login'; return; }
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    errorEl.textContent = data.error || 'Failed to save.';
    errorEl.hidden = false;
    return;
  }
  location.href = '/';
});
</script>
</body>
</html>
