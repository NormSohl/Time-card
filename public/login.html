<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Card — Log In</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f5f5f5; }
  @media (prefers-color-scheme: dark) { body { background: #1a1a1a; color: #eee; } input { background: #2a2a2a; color: #eee; border-color: #444; } }
  form { background: canvas; padding: 2rem; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 0.75rem; width: 240px; }
  h1 { font-size: 1.1rem; margin: 0 0 0.5rem; }
  input { padding: 0.6rem; font-size: 1rem; border-radius: 6px; border: 1px solid #ccc; }
  button { padding: 0.6rem; font-size: 1rem; border-radius: 6px; border: none; background: #2563eb; color: white; cursor: pointer; }
  .error { color: #dc2626; font-size: 0.85rem; }
</style>
</head>
<body>
<form method="POST" action="/login">
  <h1>Time Card</h1>
  <input type="password" name="password" placeholder="Password" autofocus required>
  <button type="submit">Log in</button>
</form>
<script>
  if (new URLSearchParams(location.search).get('error')) {
    document.querySelector('form').insertAdjacentHTML('beforeend', '<div class="error">Wrong password.</div>');
  }
</script>
</body>
</html>
